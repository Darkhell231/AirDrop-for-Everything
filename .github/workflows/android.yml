# Положите этот файл в репозиторий как: .github/workflows/android.yml
name: Build Android APK

on:
  workflow_dispatch:   # запуск вручную кнопкой "Run workflow"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''   # не ставить устаревший пакет "tools" (из-за него был сбой)

      - name: Install SDK platform and NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust library (JNI .so)
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o shells/android/app/src/main/jniLibs \
            build --release -p airdrop-ffi

      # В манифесте указана несуществующая тема (NoTitleBar) - заменяем на NoActionBar
      - name: Fix manifest theme
        run: |
          sed -i 's/Theme.Material.NoTitleBar/Theme.Material.NoActionBar/' \
            shells/android/app/src/main/AndroidManifest.xml
          grep -n "style/Theme" shells/android/app/src/main/AndroidManifest.xml

      # В репозитории нет gradlew, поэтому берём Gradle напрямую
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: shells/android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AirDrop4E-debug-apk
          path: shells/android/app/build/outputs/apk/debug/*.apk
